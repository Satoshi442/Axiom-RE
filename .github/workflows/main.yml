name: Build Axiom-RE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip xz-utils

      - name: Download Dependencies
        run: |
          mkdir -p deps

          # Preloader
          git clone --depth 1 https://github.com/LiteLDev/preloader-android.git deps/preloader-android

          # fmtlib (required by preloader)
          git clone --branch 10.2.1 --depth 1 https://github.com/fmtlib/fmt.git deps/fmt

          # Dear ImGui
          git clone --branch v1.90.4 --depth 1 https://github.com/ocornut/imgui.git deps/imgui

          # Capstone
          git clone --depth 1 https://github.com/capstone-engine/capstone.git deps/capstone

          # Frida GUM devkit (prebuilt for Android ARM64)
          mkdir -p deps/frida-gum
          curl -L -o frida-gum.tar.xz \
            "https://github.com/frida/frida/releases/download/16.5.6/frida-gum-devkit-16.5.6-android-arm64.tar.xz"
          tar -xf frida-gum.tar.xz -C deps/frida-gum
          rm frida-gum.tar.xz
          
      - name: Verify frida-gum.h
        run: |
          echo "=== Frida GUM contents ==="
          ls -la deps/frida-gum/
          if [ ! -f deps/frida-gum/frida-gum.h ]; then
            echo "ERROR: frida-gum.h not found"
            exit 1
          fi
          echo "SUCCESS: frida-gum.h found"

      - name: Build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static
          cmake --build build -j4

      - name: Package Levipack
        run: |
          mkdir -p dist
          cp manifest.json dist/
          cp build/libaxiom_re.so dist/
          cd dist && zip -r ../Axiom-RE.levipack .

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-RE-Mod
          path: Axiom-RE.levipack
