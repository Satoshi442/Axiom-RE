name: Build Axiom-RE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Download Dependencies automatically
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/LiteLDev/preloader-android.git deps/preloader-android
          git clone --branch v1.90.4 --depth 1 https://github.com/ocornut/imgui.git deps/imgui
          git clone --depth 1 https://github.com/jmpews/dobby.git deps/dobby

      - name: Build Mod
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28
          cmake --build build -j4

      - name: Package Levipack
        run: |
          mkdir -p dist
          cp manifest.json dist/
          cp build/libaxiom_re.so dist/
          cd dist && zip -r ../Axiom-RE.levipack .

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-RE-Mod
          path: Axiom-RE.levipack
