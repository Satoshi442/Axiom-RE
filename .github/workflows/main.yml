name: Build Axiom-RE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip
      - name: Download Dependencies
        run: |
          mkdir -p deps
          git clone --depth 1 https://github.com/LiteLDev/preloader-android.git deps/preloader-android
          git clone --branch 10.2.1 --depth 1 https://github.com/fmtlib/fmt.git deps/fmt
          git clone --branch v1.90.4 --depth 1 https://github.com/ocornut/imgui.git deps/imgui
          git clone --depth 1 https://github.com/capstone-engine/capstone.git deps/capstone
          mkdir -p deps/frida-gum
          curl -fSL -o frida-gum.tar.xz "https://github.com/frida/frida/releases/download/17.23.0/frida-gum-devkit-17.23.0-android-arm64.tar.xz"
          tar -xf frida-gum.tar.xz -C deps/frida-gum
          rm frida-gum.tar.xz
      - name: Build
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared
          cmake --build build -j4
      - name: Package Levipack
        run: |
          mkdir -p dist && cp manifest.json dist/ && cp build/libaxiom_re.so dist/
          cd dist && zip -r ../Axiom-RE.levipack .
      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-RE-Mod
          path: Axiom-RE.levipack
