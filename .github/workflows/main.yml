- name: Download Dependencies
        run: |
          mkdir -p deps

          # Preloader
          git clone --depth 1 https://github.com/LiteLDev/preloader-android.git deps/preloader-android

          # fmtlib (required by preloader)
          git clone --branch 10.2.1 --depth 1 https://github.com/fmtlib/fmt.git deps/fmt

          # Dear ImGui
          git clone --branch v1.90.4 --depth 1 https://github.com/ocornut/imgui.git deps/imgui

          # Capstone
          git clone --depth 1 https://github.com/capstone-engine/capstone.git deps/capstone

          # Frida GUM devkit (prebuilt for Android ARM64)
          mkdir -p deps/frida-gum
          curl -L -o frida-gum.tar.xz \
            "https://github.com/frida/frida/releases/download/16.5.6/frida-gum-devkit-16.5.6-android-arm64.tar.xz"
          tar -xf frida-gum.tar.xz -C deps/frida-gum
          rm frida-gum.tar.xz
